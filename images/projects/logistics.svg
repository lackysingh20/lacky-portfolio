<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Logistics truck with SOP, flow and agent boxes">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
<pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".18"/></pattern></defs>
<rect width="800" height="450" fill="url(#g)"/><rect width="800" height="450" fill="url(#d)"/><rect x="60" y="70" width="170" height="70" rx="14" fill="#fff" opacity="1" /><text x="145" y="113" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">SOP 1</text><rect x="260" y="70" width="170" height="70" rx="14" fill="#fff" opacity="1" /><text x="345" y="113" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">Flow 2</text><rect x="460" y="70" width="170" height="70" rx="14" fill="#fff" opacity="1" /><text x="545" y="113" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">Agent 3</text><rect x="160" y="180" width="170" height="70" rx="14" fill="#fff" opacity="1" /><text x="245" y="223" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">SOP 4</text><rect x="360" y="180" width="170" height="70" rx="14" fill="#fff" opacity="1" /><text x="445" y="223" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">Flow 5</text><rect x="560" y="180" width="170" height="70" rx="14" fill="#fff" opacity="1" /><text x="645" y="223" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">Agent 6</text><g transform="translate(270,290)"><rect width="190" height="80" rx="10" fill="#fff"/><path d="M190 20 H250 L280 50 V80 H190 Z" fill="#fed7aa"/><circle cx="45" cy="88" r="20" fill="#0f172a"/><circle cx="235" cy="88" r="20" fill="#0f172a"/></g><text x="40" y="425" font-family="Space Grotesk,Inter,Arial,sans-serif" font-size="18" font-weight="500" fill="#ffedd5" text-anchor="start">19 SOPs + 24 flows → ~320 objectives</text></svg>